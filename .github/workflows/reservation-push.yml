name: Lightpia Reservation Push

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Lightpia Web App (same source as APK)']
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: lightpia-reservation-push
  cancel-in-progress: false

jobs:
  send-reservation-push:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract server workers
        run: |
          set -euo pipefail
          unzip -q LIGHTPIA_v9_6_62_notification_center.zip -d /tmp/lightpia-service
          mkdir -p push_sender
          cp -r /tmp/lightpia-service/lightpia_updated/push_sender/. push_sender/
      - name: Install sender dependencies
        working-directory: push_sender
        run: npm install --no-audit --no-fund
      - name: Process administrator deletion requests
        working-directory: push_sender
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIGHT_4E07D }}
        run: node admin-worker.mjs
      - name: Send reservation notifications
        working-directory: push_sender
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIGHT_4E07D }}
        run: node send-notifications.mjs

