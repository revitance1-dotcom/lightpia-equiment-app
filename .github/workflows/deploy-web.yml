name: Deploy Lightpia Web App V9.6.37
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-web.yml'
      - 'firebase.json'
permissions:
  contents: read
concurrency:
  group: lightpia-web-live
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract verified V9.6.37 web app
        run: |
          set -euo pipefail
          echo 'ce5b7a73fba3dd4c5b2f57103d6b60f96a2436488239fbeb7188b41c7ee0f724  LIGHTPIA_v9_6_37_loan_groups.zip' | sha256sum -c -
          unzip -q LIGHTPIA_v9_6_37_loan_groups.zip -d /tmp/lightpia-web
          mkdir -p ./www
          cp -r /tmp/lightpia-web/lightpia_updated/www/. ./www/
          test -s www/index.html
          test -s www/crew-board.js
          test -s www/equipment-photos.js
      - name: Validate source and record release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for file in www/*.js; do node --check "$file"; done
          cd /tmp/lightpia-web/lightpia_updated
          node review/check.cjs
          node review/push-panel.cjs
          node review/search-back.cjs
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('www')
          text=(root/'index.html').read_text()
          assert 'data-tab="crew"' in text and 'id="view-crew"' in text
          assert 'v9-6-37-loan-groups-1' in (root/'sw.js').read_text()
          assert 'light-4e07d' in (root/'app.js').read_text()
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'release.json').write_text(json.dumps({'version':'9.6.37','commit':os.environ['RELEASE_COMMIT'],'source':'LIGHTPIA_v9_6_37_loan_groups.zip','files':files},indent=2))
          print('Prepared V9.6.37 release:',len(files),'files')
          PY
      - name: Install browser for live login check
        run: |
          npm install --prefix /tmp/lightpia-web-browser --no-save --no-package-lock playwright@1.56.1
          node /tmp/lightpia-web-browser/node_modules/playwright/cli.js install chromium
      - name: Verify Korean IME and rapid taps before deployment
        working-directory: /tmp/lightpia-web/lightpia_updated
        env:
          NODE_PATH: /tmp/lightpia-web-browser/node_modules
        run: |
          node review/ime-touch-ui.cjs
          node review/loan-groups-ui.cjs
      - name: Install signup and inventory rule test tools
        run: npm install --prefix /tmp/lightpia-admin-tests --no-save --no-package-lock firebase-tools@13.35.1 @firebase/rules-unit-testing@3.0.4 firebase@10.14.1 firebase-admin@13.0.0
      - name: Prepare rules from current production version
        working-directory: /tmp/lightpia-web/lightpia_updated/push_sender
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIGHT_4E07D }}
          NODE_PATH: /tmp/lightpia-admin-tests/node_modules
        run: |
          npm install --no-audit --no-fund
          node prepare-admin-rules.mjs
      - name: Verify signup recovery and existing permissions against candidate rules
        working-directory: /tmp/lightpia-web/lightpia_updated
        env:
          NODE_PATH: /tmp/lightpia-admin-tests/node_modules
          RULES_FILE: /tmp/lightpia-rules/candidate.rules
        run: /tmp/lightpia-admin-tests/node_modules/.bin/firebase emulators:exec --only firestore,auth --project demo-lightpia --config firebase.test.json "node review/run-rule-tests.cjs"
      - name: Release validated optional-team signup rule
        working-directory: /tmp/lightpia-web/lightpia_updated/push_sender
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIGHT_4E07D }}
        run: node release-admin-rules.mjs
      - name: Deploy to Firebase Hosting live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIGHT_4E07D }}
          channelId: live
          projectId: light-4e07d
      - name: Verify live files match the tested source
        run: |
          python3 - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          expected=json.loads(Path('www/release.json').read_text())
          base='https://light-4e07d.web.app'
          for attempt in range(3):
              try:
                  request=urllib.request.Request(base+'/release.json',headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request,timeout=30) as r:
                      actual=json.load(r)
                  assert actual==expected,'Release does not match'
                  for name in ['index.html','app.js','sw.js','equipment-photos.js','crew-board.js','crew-model.js','signup-model.js','search-input.js','loan-groups.js','maintenance-model.js','bulk-loan-model.js','equipment-search.js','android-back.js','brand-banner.svg','manifest.webmanifest']:
                      request=urllib.request.Request(base+'/'+name,headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=30) as r:
                          data=r.read()
                          assert 'no-cache' in r.headers.get('Cache-Control',''),name+' cache policy'
                          if name.endswith('.js'): assert 'javascript' in r.headers.get('Content-Type',''),name+' MIME type'
                      assert hashlib.sha256(data).hexdigest()==expected['files'][name],name+' source mismatch'
                  print('Verified live V9.6.37:',base)
                  break
              except Exception:
                  if attempt==2: raise
                  time.sleep(5)
          PY
      - name: Verify live app initializes in browser
        env:
          NODE_PATH: /tmp/lightpia-web-browser/node_modules
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try {
              const page=await browser.newPage({viewport:{width:393,height:850}});
              const errors=[];page.on('pageerror',error=>errors.push(error.message));
              await page.goto('https://light-4e07d.web.app/',{waitUntil:'networkidle',timeout:60000});
              await page.waitForFunction(()=>document.getElementById('connection')?.textContent.includes('로그인 필요'),{timeout:30000});
              if(!await page.locator('#loginGate').isVisible())throw Error('Login screen missing');
              if(await page.locator('[data-search-submit=equipmentSearch]').count()!==1)throw Error('Search button missing');
              if(await page.locator('#equipmentSearch').getAttribute('contenteditable')!=='plaintext-only')throw Error('New Korean search editor missing');
              if(await page.locator('[data-tab="crew"]').count()!==1)throw Error('Crew tab missing');
              await page.evaluate(()=>{document.getElementById('app').classList.remove('hidden');document.getElementById('loginGate').classList.add('hidden');});
              await page.locator('[data-tab="settings"]').click();
              await page.locator('#userGuide>summary').click();
              if(await page.locator('.guide-topic').count()!==14)throw Error('Manual topics missing');
              if(!await page.locator('.guide-version').isVisible())throw Error('Manual version missing');
              for(const width of [320,393,1280]){
                await page.setViewportSize({width,height:900});
                await page.locator('.guide-topic').evaluateAll(items=>items.forEach(item=>item.open=true));
                if(!await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1))throw Error('Manual horizontal overflow '+width);
              }
              if(!(await page.locator('#guide-damage').innerText()).includes('본인이 등록한 신고만'))throw Error('Cancellation guide missing');
              if(!(await page.locator('#guide-backup').innerText()).includes('JSON 백업에 포함되지 않습니다.'))throw Error('Backup scope missing');
              console.log('PASS live manual: 14 sections visible under Settings, current roles/photos/recruitment/backup instructions, 320/393/1280 widths without overflow');
              if(errors.length)throw Error(errors.join('\n'));
              console.log('PASS live browser: Firebase initialized, login ready, current modules loaded, recruitment tab present, no uncaught errors');
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exit(1)});
          JS

