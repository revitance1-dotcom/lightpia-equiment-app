
name: Build LnS Android APK V9

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract app
        run: |
          unzip -q lightpia_equipment_v9_6_7_build_fixed.zip -d /tmp/lightpia
          cp -r /tmp/lightpia/lightpia_apk_project/www ./www
          cp /tmp/lightpia/lightpia_apk_project/package.json ./package.json
          cp /tmp/lightpia/lightpia_apk_project/capacitor.config.json ./capacitor.config.json

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Apply branded launcher icons
        run: |
          python3 - <<'PYICONS'
          import os, shutil
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              target=f'android/app/src/main/res/mipmap-{density}'
              os.makedirs(target,exist_ok=True)
              for name in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  shutil.copyfile(f'www/icon-{size}.png',f'{target}/{name}')
          PYICONS

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: lightpia-softsun-v9-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
