name: Build LnS Android APK (fixed signing key)

"on":
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: lightpia-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[web-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Cancel superseded APK builds
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const result = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'build-apk.yml', status: 'in_progress', per_page: 20 });
            for (const run of result.data.workflow_runs) {
              if (run.id < context.runId && run.head_branch === 'main') {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
              }
            }
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract app
        run: |
          set -euo pipefail
          unzip -q LIGHTPIA_v9_6_56_release_guide.zip -d /tmp/lightpia
          mkdir -p ./www
          cp -r /tmp/lightpia/lightpia_updated/www/. ./www/
          cp /tmp/lightpia/lightpia_updated/package.json ./package.json
          cp /tmp/lightpia/lightpia_updated/capacitor.config.json ./capacitor.config.json

      - name: Validate app source
        working-directory: /tmp/lightpia/lightpia_updated
        run: |
          node --input-type=module --check < www/app.js
          node --input-type=module --check < www/photo-backup.js
          node --input-type=module --check < www/reservation-parties.js
          node review/check.cjs
          node review/korean-holidays.cjs
          node review/equipment-schedule.cjs
          node review/display-order.cjs
          node review/equipment-units.cjs
          node review/period-capacity.cjs
          node review/team-lifecycle.cjs
          node review/team-delete.mjs
          node review/team-render.cjs
          node review/push-panel.cjs
          node review/search-back.cjs

      - name: Test administrator permissions and deletion worker
        working-directory: /tmp/lightpia/lightpia_updated
        env:
          NODE_PATH: /tmp/lightpia-admin-tests/node_modules
        run: |
          npm install --prefix /tmp/lightpia-admin-tests --no-save --no-package-lock firebase-tools@13.35.1 @firebase/rules-unit-testing@3.0.4 firebase@10.14.1 firebase-admin@13.0.0
          /tmp/lightpia-admin-tests/node_modules/.bin/firebase emulators:exec --only firestore,auth --project demo-lightpia --config firebase.test.json "node review/equipment-editors-rules.cjs && node review/bulk-loan.cjs && node review/run-admin-tests.cjs"

      - name: Cache layout browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-lightpia-playwright-1.56.1

      - name: Install layout test browser
        timeout-minutes: 6
        run: |
          npm install --prefix /tmp/lightpia-ui --no-save --no-package-lock playwright@1.56.1
          node /tmp/lightpia-ui/node_modules/playwright/cli.js install chromium

      - name: Verify photo backups and external reservations
        timeout-minutes: 3
        working-directory: /tmp/lightpia/lightpia_updated
        env:
          NODE_PATH: /tmp/lightpia-ui/node_modules
        run: |
          node review/equipment-editors-ui.cjs
          node review/equipment-schedule-ui.cjs
          node review/display-order-ui.cjs
          node review/equipment-units-ui.cjs
          node review/photo-backup-ui.cjs
          node review/external-reservations-ui.cjs

      - name: Verify loan layout
        timeout-minutes: 2
        working-directory: /tmp/lightpia/lightpia_updated
        env:
          NODE_PATH: /tmp/lightpia-ui/node_modules
          UI_SCREENSHOT_DIR: /tmp/lightpia-ui/screenshots
        run: node review/loan-ui.cjs

      - name: Verify Korean IME and rapid quantity taps
        timeout-minutes: 3
        working-directory: /tmp/lightpia/lightpia_updated
        env:
          NODE_PATH: /tmp/lightpia-ui/node_modules
        run: node review/ime-touch-ui.cjs

      - name: Verify grouped internal and external rentals
        timeout-minutes: 3
        working-directory: /tmp/lightpia/lightpia_updated
        env:
          NODE_PATH: /tmp/lightpia-ui/node_modules
        run: node review/loan-groups-ui.cjs

      - name: Verify account team and project labels
        timeout-minutes: 2
        working-directory: /tmp/lightpia/lightpia_updated
        env:
          NODE_PATH: /tmp/lightpia-ui/node_modules
        run: |
          node review/account-label-ui.cjs
          node review/team-archive-ui.cjs
          node review/stock-returns-ui.cjs

      - name: Verify studio layout
        timeout-minutes: 2
        working-directory: /tmp/lightpia/lightpia_updated
        env:
          NODE_PATH: /tmp/lightpia-ui/node_modules
          UI_SCREENSHOT_DIR: /tmp/lightpia-ui/screenshots
        run: node review/studio-ui.cjs

      - name: Verify equipment registration basket
        timeout-minutes: 2
        working-directory: /tmp/lightpia/lightpia_updated
        env:
          NODE_PATH: /tmp/lightpia-ui/node_modules
          UI_SCREENSHOT_DIR: /tmp/lightpia-ui/screenshots
        run: node review/admin-ui.cjs

      - name: Verify administrator and team maintenance screens
        timeout-minutes: 2
        working-directory: /tmp/lightpia/lightpia_updated
        env:
          NODE_PATH: /tmp/lightpia-ui/node_modules
          UI_SCREENSHOT_DIR: /tmp/lightpia-ui/screenshots
        run: node review/maintenance-ui.cjs

      - name: Verify isolated equipment tags and Android back navigation
        timeout-minutes: 2
        working-directory: /tmp/lightpia/lightpia_updated
        env:
          NODE_PATH: /tmp/lightpia-ui/node_modules
        run: node review/edit-search-ui.cjs

      - name: Verify equipment photos and crew recruitment
        timeout-minutes: 3
        working-directory: /tmp/lightpia/lightpia_updated
        env:
          NODE_PATH: /tmp/lightpia-ui/node_modules
          UI_SCREENSHOT_DIR: /tmp/lightpia-ui/screenshots
        run: |
          node review/photos-crew-ui.cjs
          node review/photo-frame-ui.cjs
          node review/shared-photos-ui.cjs
          node review/backup-ui.cjs

      - name: Upload loan layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightpia-studio-ui-screenshots
          path: /tmp/lightpia-ui/screenshots/*.png
          if-no-files-found: ignore

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Apply branded launcher icons
        run: |
          python3 - <<'PYICONS'
          import os, shutil

          for density, size in [
              ('mdpi', 48),
              ('hdpi', 72),
              ('xhdpi', 96),
              ('xxhdpi', 144),
              ('xxxhdpi', 192),
          ]:
              target = f'android/app/src/main/res/mipmap-{density}'
              os.makedirs(target, exist_ok=True)
              for name in (
                  'ic_launcher.png',
                  'ic_launcher_round.png',
                  'ic_launcher_foreground.png',
              ):
                  shutil.copyfile(f'www/icon-{size}.png', f'{target}/{name}')
          PYICONS

      - name: Sync Android
        run: npx cap sync android

      - name: Configure Firebase Android FCM
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail

          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo 'Missing GOOGLE_SERVICES_JSON_B64 GitHub secret.' >&2
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json

          python3 - <<'PYGRADLE'
          from pathlib import Path

          root = Path('android/build.gradle')
          content = root.read_text()
          if "com.google.gms:google-services" not in content:
              content = content.replace(
                  'dependencies {',
                  "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'",
                  1,
              )
          root.write_text(content)

          app = Path('android/app/build.gradle')
          content = app.read_text()
          if "com.google.gms.google-services" not in content:
              content += "\napply plugin: 'com.google.gms.google-services'\n"
          app.write_text(content)
          PYGRADLE

          python3 - <<'PYCHANNEL'
          from pathlib import Path

          p = Path('android/app/src/main/java/com/lightpia/equipment/MainActivity.java')
          p.parent.mkdir(parents=True, exist_ok=True)

          lines = [
              'package com.lightpia.equipment;',
              'import android.app.NotificationChannel;',
              'import android.app.NotificationManager;',
              'import android.os.Build;',
              'import android.os.Bundle;',
              'import com.getcapacitor.BridgeActivity;',
              'public class MainActivity extends BridgeActivity {',
              '  @Override public void onCreate(Bundle state) {',
              '    super.onCreate(state);',
              '    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {',
              '      NotificationChannel channel = new NotificationChannel("reservation_alerts", "예약 알림", NotificationManager.IMPORTANCE_HIGH);',
              '      getSystemService(NotificationManager.class).createNotificationChannel(channel);',
              '    }',
              '  }',
              '}',
          ]

          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PYCHANNEL

      - name: Restore and verify original V9.6.21 signing key
        env:
          LNS_DEBUG_KEYSTORE_B64: ${{ secrets.LNS_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "$LNS_DEBUG_KEYSTORE_B64" ]; then
            echo 'Missing LNS_DEBUG_KEYSTORE_B64' >&2
            exit 1
          fi

          mkdir -p "$HOME/.android"
          printf '%s' "$LNS_DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          ACTUAL_SHA256="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA256='5146208232E737B90EEDD0FAADE6836EABAEE31739B2D78595829D25825472F8'

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo 'Signing key DOES NOT match installed V9.6.21 APK. Stopping to prevent incompatible APK.' >&2
            echo "Key SHA256: $ACTUAL_SHA256" >&2
            exit 1
          fi

          echo 'Original V9.6.21 signing certificate verified.'

      - name: Force Gradle to sign with the verified original key
        run: |
          python3 - <<'PYSIGN'
          from pathlib import Path

          p = Path('android/app/build.gradle')
          s = p.read_text()

          s += """
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          """

          p.write_text(s)
          PYSIGN

      - name: Set increasing Android version code
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PYVERSION'
          import os
          import re
          from pathlib import Path

          p = Path('android/app/build.gradle')
          s = p.read_text()

          version_code = 300000 + int(os.environ['RUN_NUMBER'])
          s, count = re.subn(
              r'versionCode\s+\d+',
              f'versionCode {version_code}',
              s,
              count=1,
          )

          if count != 1:
              raise RuntimeError('Could not find versionCode')

          p.write_text(s)
          print('Android versionCode:', version_code)
          PYVERSION

      - name: Build updateable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify packaged app matches source
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path('android/app/build/outputs/apk/debug/app-debug.apk')
          with ZipFile(apk) as z:
              for name in ('app.js', 'index.html', 'sw.js', 'maintenance-model.js', 'bulk-loan-model.js', 'equipment-search.js', 'android-back.js', 'equipment-photos.js', 'equipment-units.js', 'availability-model.js', 'reservation-fulfillment.js', 'photo-backup.js', 'reservation-parties.js', 'crew-board.js', 'crew-model.js', 'signup-model.js', 'search-input.js', 'loan-groups.js'):
                  assert z.read('assets/public/' + name) == Path('www', name).read_bytes(), name + ' does not match source'
              assert any(p.get('classpath') == 'com.capacitorjs.plugins.app.AppPlugin' for p in json.loads(z.read('assets/capacitor.plugins.json'))), 'Native App back button plugin missing'
          print('APK contains the validated source.')
          print('APK SHA256:', hashlib.sha256(apk.read_bytes()).hexdigest())
          PYVERIFY

      - name: Prepare isolated administrator queue rules
        working-directory: /tmp/lightpia/lightpia_updated/push_sender
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIGHT_4E07D }}
        run: |
          npm install --no-audit --no-fund
          node prepare-admin-rules.mjs

      - name: Validate candidate rules against current production baseline
        working-directory: /tmp/lightpia/lightpia_updated
        env:
          NODE_PATH: /tmp/lightpia-admin-tests/node_modules
          RULES_FILE: /tmp/lightpia-rules/candidate.rules
        run: /tmp/lightpia-admin-tests/node_modules/.bin/firebase emulators:exec --only firestore --project demo-lightpia --config firebase.test.json "node review/run-rule-tests.cjs"

      - name: Enable validated administrator queue rules
        working-directory: /tmp/lightpia/lightpia_updated/push_sender
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIGHT_4E07D }}
        run: |
          node release-admin-rules.mjs
          node bootstrap-availability.mjs

      - name: Correct the requested equipment tag aliases once
        working-directory: /tmp/lightpia/lightpia_updated/push_sender
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIGHT_4E07D }}
        run: node correct-18k-tags.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: lightpia-softsun-updateable-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
