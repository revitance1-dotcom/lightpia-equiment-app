          import os, shutil
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              target=f'android/app/src/main/res/mipmap-{density}'
              os.makedirs(target,exist_ok=True)
              for name in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  shutil.copyfile(f'www/icon-{size}.png',f'{target}/{name}')
          PYICONS
      - name: Sync Android
        run: npx cap sync android
      - name: Restore permanent signing key
        env:
          LNS_DEBUG_KEYSTORE_B64: ${{ secrets.LNS_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$LNS_DEBUG_KEYSTORE_B64" || { echo 'Missing signing key secret' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/lns-signing"
          printf '%s' "$LNS_DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lns-signing/debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/lns-signing/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "LNS_KEYSTORE_PATH=$RUNNER_TEMP/lns-signing/debug.keystore" >> "$GITHUB_ENV"
      - name: Set version and explicit signing configuration
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PYCONFIG'
          import os, pathlib, re
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          version = 200000 + int(os.environ['RUN_NUMBER'])
          s, n = re.subn(r'\bversionCode\s+\d+', f'versionCode {version}', s, count=1)
          if n != 1: raise RuntimeError('versionCode not found')
          # Android Gradle Plugin creates a debug signing config by default.
          # Force it to use the persistent keystore, not the runner-generated one.
          block = '''
          afterEvaluate {
              android.signingConfigs.debug.storeFile = file(System.getenv('LNS_KEYSTORE_PATH'))
              android.signingConfigs.debug.storePassword = 'android'
              android.signingConfigs.debug.keyAlias = 'androiddebugkey'
              android.signingConfigs.debug.keyPassword = 'android'
              android.buildTypes.debug.signingConfig = android.signingConfigs.debug
          }
          '''
          p.write_text(s + '\n' + block)
          print('Android versionCode:', version)
          PYCONFIG
      - name: Build updateable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK signing matches permanent key
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          keytool -printcert -jarfile "$APK" > "$RUNNER_TEMP/apk-cert.txt"
          keytool -exportcert -alias androiddebugkey -keystore "$LNS_KEYSTORE_PATH" -storepass android -rfc > "$RUNNER_TEMP/key-cert.pem"
          keytool -printcert -file "$RUNNER_TEMP/key-cert.pem" > "$RUNNER_TEMP/key-cert.txt"
          python3 - <<'PYVERIFY'
          import pathlib,re,os
          a=pathlib.Path(os.environ['RUNNER_TEMP']+'/apk-cert.txt').read_text()
          b=pathlib.Path(os.environ['RUNNER_TEMP']+'/key-cert.txt').read_text()
          pattern=r'SHA256:\s*([0-9A-Fa-f:]+)'
          x=re.search(pattern,a); y=re.search(pattern,b)
          if not x or not y: raise RuntimeError('Cannot read certificate fingerprints')
          print('APK signer SHA256:', x.group(1))
          print('Expected SHA256:', y.group(1))
          if x.group(1).lower()!=y.group(1).lower():
              raise RuntimeError('APK signed by wrong key; refusing to publish')
          PYVERIFY
      - uses: actions/upload-artifact@v4
        with:
          name: lightpia-softsun-verified-update-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
