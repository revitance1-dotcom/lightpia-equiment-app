name: Lightpia Reservation Push

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: lightpia-reservation-push
  cancel-in-progress: false

jobs:
  send-reservation-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract server workers
        run: |
          set -euo pipefail
          unzip -q LIGHTPIA_v9_6_47_damage_ea.zip -d /tmp/lightpia-service
          mkdir -p push_sender
          cp -r /tmp/lightpia-service/lightpia_updated/push_sender/. push_sender/
      - name: Install sender dependencies
        working-directory: push_sender
        run: npm install --no-audit --no-fund
      - name: Process administrator deletion requests
        working-directory: push_sender
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIGHT_4E07D }}
        run: node admin-worker.mjs
      - name: Send reservation notifications
        working-directory: push_sender
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIGHT_4E07D }}
        run: node send.mjs

