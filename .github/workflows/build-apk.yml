name: Build LnS Android APK (verified permanent signing)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract app
        run: |
          unzip -q lightpia_equipment_v9_6_13_member_groups.zip -d /tmp/lightpia
          cp -r /tmp/lightpia/lightpia_apk_project/www ./www
          cp /tmp/lightpia/lightpia_apk_project/package.json ./package.json
          cp /tmp/lightpia/lightpia_apk_project/capacitor.config.json ./capacitor.config.json
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Apply branded launcher icons
        run: |
          python3 - <<'PYICONS'
          import os, shutil
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              target=f'android/app/src/main/res/mipmap-{density}'
              os.makedirs(target,exist_ok=True)
              for name in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  shutil.copyfile(f'www/icon-{size}.png',f'{target}/{name}')
          PYICONS
      - name: Sync Android
        run: npx cap sync android
      - name: Restore permanent signing key
        env:
          LNS_DEBUG_KEYSTORE_B64: ${{ secrets.LNS_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$LNS_DEBUG_KEYSTORE_B64" || { echo 'Missing signing key secret' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/lns-signing"
          printf '%s' "$LNS_DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lns-signing/debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/lns-signing/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "LNS_KEYSTORE_PATH=$RUNNER_TEMP/lns-signing/debug.keystore" >> "$GITHUB_ENV"
      - name: Set version and explicit signing configuration
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PYCONFIG'
          import os, pathlib, re
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          version = 200000 + int(os.environ['RUN_NUMBER'])
          s, n = re.subn(r'\bversionCode\s+\d+', f'versionCode {version}', s, count=1)
          if n != 1: raise RuntimeError('versionCode not found')
          # Android Gradle Plugin creates a debug signing config by default.
          # Force it to use the persistent keystore, not the runner-generated one.
          block = '''
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv('LNS_KEYSTORE_PATH'))
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.debug }
              }
          }
          '''
          p.write_text(s + '\n' + block)
          print('Android versionCode:', version)
          PYCONFIG
      - name: Build updateable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK signing matches permanent key
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-cert.txt"
          keytool -exportcert -keystore "$LNS_KEYSTORE_PATH" -storepass android -alias androiddebugkey -rfc > "$RUNNER_TEMP/key-cert.pem"
          openssl x509 -in "$RUNNER_TEMP/key-cert.pem" -noout -fingerprint -sha256 > "$RUNNER_TEMP/key-fingerprint.txt"
          python3 - <<'PYVERIFY'
          import pathlib, re, os
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          apk_info = (temp/'apk-cert.txt').read_text()
          key_info = (temp/'key-fingerprint.txt').read_text()
          # Android build-tools may print either "SHA-256 digest" or "SHA-256".
          matches = re.findall(r'(?im)^.*certificate\s+SHA-?256(?:\s+digest)?\s*:\s*([0-9a-f:]+)\s*$', apk_info)
          if not matches:
              matches = re.findall(r'(?im)^.*SHA-?256(?:\s+digest)?\s*:\s*([0-9a-f:]+)\s*$', apk_info)
          key_match = re.search(r'(?i)sha256\s*fingerprint\s*=\s*([0-9a-f:]+)', key_info)
          if not matches or not key_match:
              print('APK certificate output:', apk_info)
              print('Key certificate output:', key_info)
              raise RuntimeError('Could not parse certificate fingerprints; see outputs above')
          normalize = lambda s: s.replace(':','').lower()
          expected = normalize(key_match.group(1))
          actual = normalize(matches[0])
          print('APK signer SHA256:', actual)
          print('Expected SHA256:', expected)
          if actual != expected:
              raise RuntimeError('APK is signed with a different key')
          print('PASS: APK signing certificate matches the permanent keystore')
          PYVERIFY
      - uses: actions/upload-artifact@v4
        with:
          name: lightpia-softsun-verified-update-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
